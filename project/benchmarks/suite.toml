status = "Cases 0-11 hardware-verified on the twelve C/Rust paths (Tock 0-10). Cases 12-15 are implemented and advertised on every FreeRTOS/Zephyr/NuttX C/Rust path (Zephyr STM32H723 stays 0-10) and hardware smoke-verified on all 24 paths (2026-10-02), plus a full 0-15 suite run. Cases 16/17/21/25/26 are hardware-verified on the FreeRTOS/STM32F4 reference in C and Rust (F4 advertises 0-17,21,25,26); FreeRTOS non-F4 (nRF52840, Pico 2, ESP32-C6) has 16/17/26 in C and Rust; nRF52840 and Pico 2 also have 21 (traceISR_* hooks) and 25 (masked-priority probe), advertising 0-17,21,25,26, while C6 has 25 (dedicated gptimer) and advertises 0-17,25,26. This required fixing the shared C `MAX_CASES` (16→27) and the ESP-IDF byte-counted peer stack (256→4096 bytes) on the C6. NuttX implements 16/17/26 on all boards in C and Rust and advertises 0-15,16,17,26; All four NuttX boards also have 25 (TIM5/TIMER4/TIMER0 ALARM2/SYSTIMER target 2 probes) and advertise 0-15,16,17,25,26. Zephyr implements 16/17/26 in C and Rust on pico2, STM32F4, ESP32-C6 and nRF52840 and advertises 0-15,16,17,26; STM32F4, nRF52840, pico2 and ESP32-C6 also have 25 (TIM5/TIMER4/TIMER0 ALARM2/SYSTIMER target 1 probe, C and Rust) and advertise 0-15,16,17,25,26. Zephyr STM32H723 has 25 (TIM5) and advertises 0-10,25; its 16/17/26 and 21 on C6/NuttX/Zephyr remain unsupported. Case 20 nested_irq_overhead is implemented on all four FreeRTOS boards, all four NuttX boards (STM32F4/nRF52840/Pico 2/ESP32-C6) and Zephyr STM32F4/nRF52840/Pico 2/ESP32-C6/STM32H723, in C and Rust. Case 20 is now on all 13 FreeRTOS/NuttX/Zephyr boards; Tock has no hardware ISR line. Case 18 ipc_payload_sweep plus the protocol/result schema-v2 optional `variant` field are implemented on the FreeRTOS/STM32F4 reference in C and Rust (five per-size queue pairs, monotonic 15.8/16.2/17.9/24.8/52.2 us; case-7 cross-check passes; F4 advertises 0-17,18,20,21,25,26); FreeRTOS/nRF52840 C+Rust also implemented (40/42/48/75/186 us monotonic; case-7 cross-check). FreeRTOS/ESP32-C6 C+Rust also implemented (21.2/21.2/21.7/22.7/25.4 us monotonic on the 160 MHz CSR; case-7 cross-check). FreeRTOS/Pico 2 is implemented but not advertised: RP2350 DWT is unstable without a debugger so the sweep is not reliably monotonic. NuttX/STM32F4 C+Rust also implemented via variable-length POSIX message queues (26.8/27.1/28.7/35.0/64.3 us monotonic; needed `CONFIG_MQ_MAXMSGSIZE=256` in the bench defconfigs); NuttX/nRF52840 (48.6/50.3/74.2/80.3/176.3 us) and NuttX/Pico 2 (22/24/26/34/64 us) are also verified. NuttX/ESP32-C6 is implemented but not advertised (high MQ tail latency after any prior case → non-monotonic); Zephyr/STM32F4 is implemented (18.0/18.3/19.4/23.7/40.8 us monotonic; case-7 cross-check 3076 vs 3080). The sample struct is packed to 16 bytes to fit the S4's RAM. Zephyr/nRF52840 is also implemented (53/54/57/68/113 us monotonic). Zephyr/Pico 2 is also implemented (10.1/10.4/11.6/16.4/35.6 us monotonic). Zephyr/ESP32-C6 is also implemented (27.9/28.3/28.6/29.3/31.4 us monotonic). Zephyr/STM32H723 is also implemented (3.6/3.6/3.8/4.3/6.4 us at 550 MHz). Case 18 now covers all 13 boards except FreeRTOS/Pico 2 and NuttX/ESP32-C6 (withheld). Case 19 ipc_throughput (`tp_*` triple, non-latency) is implemented on the FreeRTOS/STM32F4 reference in C and Rust (3.48/4.03 MiB/s, reciprocal matches case 7); the comparison script reports it as MiB/s. FreeRTOS/nRF52840 C+Rust also implemented (1.21/1.62 MiB/s; reciprocal matches case 7), FreeRTOS/Pico 2 (5.46/5.17 MiB/s) and FreeRTOS/ESP32-C6 (3.14 MiB/s). NuttX C+Rust also implemented on all four boards (F4 2.80, nRF 1.43, Pico 2 2.61, C6 2.39 MiB/s; bounded POSIX MQ). Zephyr/STM32F4 (3.41 MiB/s) and Zephyr/nRF52840 (1.13), Pico 2 (5.63), ESP32-C6 (1.28) and STM32H723 (15.06 MiB/s) C+Rust too (k_msgq). Case 19 now covers all 13 boards. This work fixed a latent bug where the Rust IPC paths never enabled the board cycle counter (read 0 in isolation on nRF/RP23XX/C6). Case 27 zero_copy_ipc (`zcopy_*` triple, value = copied minus zero-copy ticks at 256 B) is implemented and verified on the FreeRTOS/STM32F4 reference in C and Rust: the copied leg is a capacity-1 256-byte queue round trip and the zero-copy leg sends only a pointer to a shared buffer through a queue of references (FreeRTOS has no dedicated zero-copy message API). C difference 6082 ticks (36.2 us at 168 MHz), Rust 1370 ticks (8.15 us); cross-check within F4: implied copied leg equals case 18 at 256 B within 0.7% (C) / 1.4% (Rust) and the implied zero-copy leg equals case 7 within 2.2% / 2.1%. F4 advertises 0-17,18,19,20,21,25,26,27. **FreeRTOS/nRF52840 C and Rust also verified**: the same copied/zero-copy pair with `dwt_cycles()`; C difference 9072 ticks (141.8 us at 64 MHz; implied copied matches case 18/256 within 0.3%, implied zero-copy matches case 7 within 1.5%), Rust 1966 ticks (30.7 us; 1.0%/1.8%). Full advertised suite passes C+Rust at 100 reps; nRF52840 advertises `0-17,18,19,20,21,25,26,27`. FreeRTOS/Pico 2 C+Rust verified too (946 ticks = 6.31 us at 150 MHz; implied copied matches case 18/256 within 0.9%, implied zero-copy matches case 7 within 1.3%) and advertises `0-17,19,20,21,25,26,27` (case 18 stays withheld). FreeRTOS/ESP32-C6 C+Rust verified (median 653 CSR ticks = 4.08 us at 160 MHz on the `C6_TRIGGER_HZ` tag; implied zero-copy 21.2 us vs case 7 22 us; full suite passes both languages) and advertises `0-17,18,19,20,25,26,27`. A non-positive difference (zero-copy not faster for one sample) is now clamped to 0 and recorded rather than aborting the case, because a single noisy C6 sample otherwise aborted the run; genuine payload/pointer corruption still returns `BENCH_CORRUPT`. All four FreeRTOS boards now advertise 27. **NuttX/STM32F4 C+Rust verified** (shared POSIX-MQ port: copied leg = 256-byte MQ round trip reusing the case-18 buffers, zero-copy leg = an 8/4-byte pointer MQ + one stack shared buffer because the STM32F4 NuttX image sits at its 112 KB SRAM limit and three new 256-byte arrays overflowed it). C 6100 ticks (36.3 us at 168 MHz), Rust 6096; implied copied matches case 18/256 within 3.4% and implied zero-copy matches case 7 within 8.4% (the MQ round trip is bimodal). NuttX/STM32F4 advertises `0-15,16,17,18,19,20,25,26,27`. **NuttX/nRF52840 C+Rust verified too** via the shared port (C 5084 ticks = 79.4 us, Rust 8101 = 126.6 us; implied copied matches case 18/256 within 1.4% and implied zero-copy matches case 7 within 3.9%/5.2%) and advertises 27. **NuttX/Pico 2 C+Rust verified** via the shared port (C 6560 ticks = 43.7 us, implied copied matches case 18/256 within 0.4% and zero-copy matches case 7 within 1.6%; Rust 6645, 7.3%/18.2% with a bimodal case-7 baseline) and advertises 27; its full-suite re-run hit the known Pico 2 USB-CDC hello flake after two successful cross-checks, so the shared F4 full suite stands as the regression evidence. **NuttX/ESP32-C6 withholds 27**: with case 18 temporarily advertised for the diagnostic, case 27 had a median of 675 ticks but 15/50 samples clamped to 0 and a max of 5172 -- the same MQ tail jitter that withholds case 18 there -- so it is not advertised (the shared port compiles it, unadvertised). **Zephyr C+Rust verified on all five boards** via per-board k_msgq pointer pairs (copied leg reuses the case-18 buffers): STM32F4 4550/1883 ticks (cross-check <=0.4%), nRF52840 6831/1937 (0.1-0.5%; uses the DWT bench_now() -- on nRF k_cycle_get_64 is the 32.768 kHz RTC and resolved 0), Pico 2 4544/1571 (5.2%/25.4% C due to a bimodal case-7 baseline, 0.0%/0.1% Rust), ESP32-C6 50/51 ticks (0.2%), STM32H723 1569/919 (<=1.3%). S4 full advertised suites pass C+Rust at 100 reps. Case 27 is now advertised on all 12 non-Tock Implemented paths except NuttX C6. Case 22 `idle_cpu_overhead` is implemented C+Rust on the FreeRTOS/STM32F4 reference: busy/kernel CPU share in ppm from the case-21 SysTick trace hooks accumulated over a fixed 500 ms idle window (native run-time stats were rejected because FreeRTOS charges a tick ISR that preempts idle to the idle task and reports ~0). C and Rust both give a stable 544 ppm; a tick-rate control (1000->100 Hz) drops it to 56 ppm (10x). F4 is the only path advertising 22: the other FreeRTOS boards return BENCH_UNSUPPORTED from stubs (so the shared Rust adapter links) and NuttX/Zephyr omit it, because the mechanism needs a truthful tick-ISR hook and an idle-advancing window counter (the case-21 support matrix; nRF DWT stops in idle, C6 has no hook). Case 23 `cpu_overhead_under_load` is implemented C+Rust on FreeRTOS/STM32F4 via a graded busy-spin worker and the idle task's run-time counter (`configGENERATE_RUN_TIME_STATS`): 25/50/75/100% load give 251504/501824/752149/1000000 ppm, monotonic and matching the offered load; an idle-hook accumulator was rejected because it attributes worker spin to idle. F4 is the only path advertising 23. Case 24 `heap_fragmentation` is implemented C+Rust on FreeRTOS/STM32F4 against the heap_4 allocator: fill 256-byte blocks to a 16 KB margin, free every other, then binary-search the largest single allocation; value = 1e6*(1 - largest/total). Fragmented C 817740 / Rust 817882 ppm; the coalesced control (free all first) gives 95 ppm. Adding case 24 also required raising the F4 READY/start MAX_CASES 27->28 (28 advertised cases overflowed the start-case array). **FreeRTOS/nRF52840 C+Rust verified** with the same approach (C 673843, Rust 673736 ppm; the malloc-failed hook is guarded during the intentional failed probes, and MAX_CASES raised to 28) and advertises 24. **FreeRTOS/Pico 2 C+Rust verified** too (735327 ppm both; MAX_CASES 28) and advertises 24. All three FreeRTOS heap_4 boards now advertise 24. **NuttX/STM32F4 C+Rust verified** via the shared port's `mallinfo()` query (allocate 256-byte blocks to a 20% free-heap margin, free every other, value = 1e6*(1 - mxordblk/fordblks)): 667457 ppm both; coalesced control 100593 (NuttX retains residual fragmentation). The block-pointer array is heap-allocated because the STM32F4 NuttX image is at its SRAM limit. NuttX F4 advertises 24. UPDATE 2026-10-03: Zephyr STM32H723 now also implements 16/17/26 with the generic code (k_yield, lower-priority k_sem peer, four K_PRIO_COOP peers) and advertises `0-10,16,17,18,19,20,25,26,27` (case 11 still withheld over the slow USB-CDC console); its Rust bridge now maps protocol<->enum for the sparse IDs. Case 24 is now verified C+Rust on all five Zephyr boards against the 8 KB kernel system heap (k_malloc/k_free + sys_heap_runtime_stats_get on _system_heap): H723/S4/nRF/Pico 2 819981 ppm, ESP32-C6 849860 (full suite; isolated 836996), coalesced control 488. Case 24 is also verified C+Rust on NuttX Pico 2 (506382 ppm) and ESP32-C6 (604253; coalesced control 6278); NuttX nRF52840 remains gated because mallinfo().fordblks == 0 there. Case 24 therefore covers all 12 implemented paths except NuttX nRF52840; cases 22/23 remain FreeRTOS/STM32F4-only, and 21 remains FreeRTOS F4/nRF/Pico 2. Eclipse ThreadX/STM32F4 C added cases 8 (TX_MUTEX TX_INHERIT: 1901 ticks = 11.3 us, far below the ~2 ms M spin), 18 (five capacity-1 queue pairs; medians 1227/1227/1282/1486/2302 ticks for 1/4/16/64/256 B, monotonic; case-7 cross-check 0.6%), 19 (depth-8 queue: 9.86 MiB/s = 161.5 k msg/s) and 27 (256 B copied vs a 1-word reference queue: 1118 ticks difference; implied copied/zero-copy within 1.6%/3.0% of cases 18/256 and 7); the build raises TX_QUEUE_MESSAGE_MAX_SIZE 16->64 words (256 B), and the serial run timeout was raised 300 s->600 s because the 1 MiB-per-sample case-19 leg at 1000 reps pushes a full suite past 300 s. ThreadX now advertises 0,1,2,3,5,6,7,8,9,12-15,16,17,18,19,26,27,28. RT-Thread/STM32F4 and nRF52840 C added cases 8 (rt_mutex RT_IPC_FLAG_PRIO: F4 3533 ticks = 21.0 us, nRF 3854 = 60.2 us, far below the ~2 ms spin), 18 (one capacity-1 rt_mq pair with a 256-byte max; F4 monotonic 4143/4215/4378/4570/5338 ticks, nRF 4660/4828/4860/5124/6180), 19 (depth-8 rt_mq: F4 3.02 MiB/s = 49.5