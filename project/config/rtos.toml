# Schema v1. Loaded and validated by core/config_manager (rtos check / benchmark
# defaults). Explicit CLI arguments override these defaults.
schema_version = 1
status = "skeleton"
[defaults]
language = "c" # Development default; choose Rust explicitly for comparisons.
application = "smoke"
repetitions = 1000
warmup = 100
[paths]
# Relative to THIS file, not the invoking terminal.
boards = "../boards"
firmware = "../firmware"
results = "../../results/campaigns"
[serial]
baud = 115200
framing = "8N1"
startup_timeout_ms = 10000
# A full suite emits several thousand frames. The Zephyr STM32F4 console is
# slow; case 19 alone transfers 1 MiB per sample and cases 22/23 add fixed
# 500 ms windows. The slowest configurations combine a multi-minute case-19
# transfer, fragmentation at 1000 reps and the remaining suite. The limit below
# covers the slowest measured nRF run (roughly 50 min for case 24 plus the
# surrounding cases) with margin for retries.
run_timeout_ms = 9000000
# Port and probe selectors must be resolved, not guessed or hard-coded to ttyUSB0.
