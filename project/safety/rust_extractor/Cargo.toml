[package]
name = "uastw-safety-rust-extractor"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "uastw-rust-extract"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde_json = "=1.0.149"
syn = { version = "=2.0.119", features = ["full", "extra-traits", "visit"] }

[workspace]
