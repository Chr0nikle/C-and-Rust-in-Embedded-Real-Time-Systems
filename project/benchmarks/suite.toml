17 (a peer-signalled semaphore, since RT-Thread has no direct-to-task notification; F4 1054 ticks = 6.27 us, nRF 1180 = 18.4 us) at 1000 reps, removing the earlier case-16 'tick can advance across a yield' caveat. ChibiOS/RT (F4) and RT-Thread (F4) added cases 10 (trigger_to_isr: a bare handler pends a spare NVIC line in software under a PRIMASK section; ChibiOS Vector58/EXTI0 142 ticks = 0.85 us, RT-Thread DMA1_Stream0 47 ticks = 0.28 us) and 25 (max_interrupt_disabled: a 50 us one-pulse probe masked by the kernel critical section; ChibiOS GPTD5 475 ticks = 2.83 us with MAXDIS_CONTROL 5700 ticks, RT-Thread TIM5 210 ticks = 1.25 us with control 5209 ticks using rt_hw_interrupt_disable because rt_enter_critical only locks the scheduler on UP); all 1000 reps. ChibiOS now advertises 0-10,12-17,24-26,28; RT-Thread F4 0-10,12-19,24-28 and nRF the same minus the F4-only 10/25. Eclipse ThreadX/STM32F4 C added cases 4 (a TIM3 one-shot compare ISR posting a TX_SEMAPHORE; the Cortex-M port switches in PendSV, so the ISR calls the service directly; 432 ticks = 2.57 us) and 10 (EXTI0 software-pended with a bare handler; 32 ticks = 0.19 us), both wired in cortexm4_vectors.S; ThreadX then added case 25 (a TIM4 50 us one-pulse masked by TX_DISABLE/PRIMASK; 107 ticks = 0.64 us, MAXDIS_CONTROL control 5156 ticks = 30.7 us), ThreadX then added case 20 (EXTI1 priority 15 spins and pends EXTI2 priority 5 ten times, both wired in cortexm4_vectors.S; min-of-three 10398 ticks = 61.9 us, NESTED_CONTROL control 0), so it now advertises 0-10,12-20,24-28 and the full advertised suite (incl 19, 20 and 25) passes at 1000 reps. ChibiOS/RT (EXTI1/EXTI2 = Vector5C/Vector60, 11231 ticks = 66.8 us) and RT-Thread F4 (DMA1_Stream1/2, 8116 ticks = 48.3 us) added case 20 (nested_irq_overhead; min-of-three, NESTED_CONTROL controls 0), so ChibiOS advertises 0-10,12-17,20,24-26,28 and RT-Thread F4 0-10,12-20,24-28 (nRF withholds the F4-only 10/20/25). RIOT/STM32F4 C added case 10 (DMA1_Stream0 software-pended under PRIMASK with a bare isr_ handler; 66 ticks = 0.39 us) and case 20 (DMA1_Stream1/2 nesting; 6464 ticks = 38.5 us, NESTED_CONTROL control 0), so RIOT F4 advertises 0-7,9,10,12-17,20,26,28; the nRF build withholds the F4-only 10/20. Eclipse ThreadX/STM32F4 C added case 11 (TIM2 750 us release grid + calibrated TIM1 137 us injector + a bounded hog thread for the pjit sweep; PJIT_LOAD_ENABLE=0 is the load-off control; at 1000 reps the sweep gives 0% miss sentinels at variants 0/200 and 10% at 100/150, phase-dependent as for FreeRTOS), so ThreadX now advertises 0-11,12-20,24-28 and the full advertised suite passes at 1000 reps. RT-Thread F4 added case 11 too (TIM3 750 us release grid + TIM4 137 us injector + hog sweep; 1000 reps give 0% miss sentinels at variants 0/150 and 50% at 100/200, phase-dependent), so RT-Thread F4 advertises 0-11,12-20,24-28 (nRF withholds the F4-only 10/11/20/25). ChibiOS/RT and RIOT then added case 11 too: ChibiOS uses GPTD5 as the 750 us release grid plus a bounded hog task (clean control median 1007 cycles; phase-dependent miss sentinels at the load levels); RIOT uses raw TIM3 as the release grid (ISR sets a thread flag) plus a calibrated raw TIM4 bare load ISR (variant 0 clean, median 445 cycles; 100/200 tails 4784/14232). ChibiOS now advertises 0-11,12-17,20,24-26,28 and RIOT F4 0-7,9,10,11,12-17,20,26,28; the RIOT nRF build withholds the F4-only 10/11/20. Cases 21-23 (2026-10-05) also cover the classic-kernel adapters: Eclipse ThreadX/STM32F4 via TX_ENABLE_EXECUTION_CHANGE_NOTIFY (21=328 ticks, 22=200 ppm, 23=250890/500852/749724/1000000 ppm); RT-Thread/STM32F4 via a plugin-staged tick-hook override of HAL_Drivers/drv_common.c (21=1458, 22=3080, 23=250712/507200/746899/1000000) and RT-Thread/nRF52840 case 21 only (1607 ticks; 22/23 withheld, DWT stops in WFI idle); ChibiOS/RT via a staged patched SYSTICKv1/hal_st_lld.c (21=1072 ticks, 22=12 ppm delta-timer idle share, 23=247254/500686/742313/1000000). RIOT withholds 21-23 (alarm/ztimer-driven, no periodic tick or port trace hooks; no kernel CPU accounting) - the case-21/22 contract returns BENCH_UNSUPPORTED. Every proposal-survey RTOS now carries case 11."

