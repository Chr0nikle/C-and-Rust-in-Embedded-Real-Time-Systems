[package]
name = "rtos-firmware-nuttx"
version = "0.1.0"
edition = "2021"
description = "NuttX Rust adapter: DWT timer and POSIX mqueue/sem via FFI shims"

[lib]
name = "rtos_firmware_nuttx"
crate-type = ["staticlib", "rlib"]
# Host test binaries would need to link the NuttX/board FFI symbols and a panic
# strategy the host cannot provide; verification happens on hardware.
test = false
doctest = false
bench = false

[dependencies]
rtos-bench = { path = "../../../common/rust" }
